name: sync

# Refreshes the schema from the public API, regenerates the client, and cuts a
# minor release if the schema changed without breaking anything.
on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Regenerate and verify, but don't tag or release"
        type: boolean
        default: false

permissions:
  contents: write # commit + tag + create release
  issues: write # open an issue when something needs a human

concurrency:
  group: sync
  cancel-in-progress: false

env:
  OASDIFF_VERSION: "1.32.1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to read the last version

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # oasdiff needs the old schema too, so fetch to a separate file.
      - name: Fetch latest public schema
        run: make fetch OUT=openapi3.json.new

      - name: Exit early if schema unchanged
        id: changed
        run: |
          if diff -q openapi3.json openapi3.json.new >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Schema unchanged; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for breaking changes
        if: steps.changed.outputs.changed == 'true'
        id: breaking
        run: |
          set -euo pipefail
          curl -sfSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp oasdiff

          report="$(/tmp/oasdiff breaking openapi3.json openapi3.json.new \
            --severity-levels oasdiff-severity.txt --fail-on ERR 2>&1)" && rc=0 || rc=$?
          echo "$report"

          # 1 means breaking changes. Anything else means oasdiff couldn't compare.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::oasdiff exited $rc without comparing the schemas."
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
            { echo "report<<OASDIFF_EOF"; echo "$report"; echo "OASDIFF_EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          fi

      # A Go major version means moving the module path to /v2, so it is done by
      # hand rather than by this workflow.
      - name: Halt on breaking change
        if: steps.changed.outputs.changed == 'true' && steps.breaking.outputs.breaking == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.breaking.outputs.report }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          The upstream OpenAPI schema changed in a way that is **not backwards-compatible**, so the automated release was halted.

          Releasing it needs a new major version, which for a Go module means moving the module path to \`/v2\`, \`/v3\`, and so on.

          <details><summary>oasdiff report</summary>

          \`\`\`
          $REPORT
          \`\`\`

          </details>

          Triggered by run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          )"
          # Nothing is committed, so every later run lands here again.
          existing="$(gh issue list --label breaking-change --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            echo "::error::Breaking change detected; issue #$existing is already open."
            exit 1
          fi

          gh label create breaking-change \
            --description "Schema changed incompatibly; release halted" \
            --color B60205 2>/dev/null || true

          gh issue create \
            --title "Breaking API change detected: manual release required" \
            --body "$body" \
            --label "breaking-change"
          echo "::error::Breaking change detected; opened an issue and stopped."
          exit 1

      - name: Decide next version
        if: steps.changed.outputs.changed == 'true'
        id: version
        run: |
          set -euo pipefail
          # Highest semver tag, not the nearest one, so a hand-cut tag can't
          # make us recompute a version that already exists.
          BASE="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"

          if [ -z "$BASE" ]; then
            NEXT="v1.0.0"
          else
            NEXT="$(echo "${BASE#v}" | awk -F. '{printf "v%d.%d.0", $1, $2+1}')"
          fi

          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            echo "::error::$NEXT already exists. Resolve before releasing."
            exit 1
          fi

          echo "Next version: $NEXT (base: ${BASE:-none})"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger test.yml, so check here.
      - name: Regenerate and check
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mv openapi3.json.new openapi3.json
          make generate
          go build ./...
          go vet ./...
          go test ./...

      # Nothing is committed before this point, so a failure repeats every hour.
      - name: Report a stuck release
        if: failure() && steps.changed.outputs.changed == 'true' && steps.breaking.outputs.breaking != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create release-stuck \
            --description "The hourly sync cannot complete and will retry forever" \
            --color B60205 2>/dev/null || true

          if gh issue list --label release-stuck --state open --limit 1 \
              --json number --jq '.[0].number // empty' | grep -q .; then
            echo "Already reported."
            exit 0
          fi

          gh issue create --title "Release is stuck: regeneration or verification is failing" --label release-stuck --body "$(cat <<EOF
          The hourly sync failed after detecting a schema change, before committing anything. Every later run will fail the same way until someone fixes it.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Likely causes: oapi-codegen rejected the new schema, \`internal/postgen\` stopped matching the generated code, or the build, vet or tests failed.
          EOF
          )"

      - name: Report what a dry run would have done
        if: steps.changed.outputs.changed == 'true' && inputs.dry_run
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          echo "Dry run: would have released **$NEXT**." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, tag and release
        if: steps.changed.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "incident-io-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openapi3.json incident.gen.go
          git commit -m "Update to schema as of $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Regenerated from https://api.incident.io/v1/openapiV3.json"
          git tag "$NEXT"
          # --atomic, so the tag can't land without the commit.
          git push --atomic origin HEAD "refs/tags/$NEXT"
          gh release create "$NEXT" --generate-notes --title "$NEXT"
